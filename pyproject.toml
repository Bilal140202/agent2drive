[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent2drive"
version = "0.4.0"
description = "One command connects an agent to Google Drive; one command per verified, reviewable upload (optional MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ansari Bilal", email = "ansaribilal0709@gmail.com" }]
keywords = ["google-drive", "agent", "oauth", "rclone", "deliverables", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
agent2drive = "agent2drive:cli"
agent2drive-mcp = "agent2drive_mcp:main"

[project.urls]
Homepage = "https://github.com/Bilal140202/agent2drive"
Repository = "https://github.com/Bilal140202/agent2drive"
Issues = "https://github.com/Bilal140202/agent2drive/issues"

[tool.setuptools]
py-modules = ["agent2drive", "agent2drive_mcp"]
