[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent2drive"
version = "0.3.0"
description = "One command connects an agent to Google Drive; one command per verified, reviewable upload."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ansari Bilal", email = "ansaribilal0709@gmail.com" }]
keywords = ["google-drive", "agent", "oauth", "rclone", "deliverables", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
agent2drive = "agent2drive:cli"

[project.urls]
Homepage = "https://github.com/Bilal140202/agent2drive"
Repository = "https://github.com/Bilal140202/agent2drive"
Issues = "https://github.com/Bilal140202/agent2drive/issues"

[tool.hatch.build.targets.wheel]
modules = ["agent2drive.py"]
